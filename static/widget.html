<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Консультант ekt.kz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px system-ui;color:#172a38;background:#f4f7f6}body{display:flex;flex-direction:column}header{background:#146552;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px;background:#146552;color:#fff}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #d8a424;outline-offset:2px}header button{font-size:22px;padding:0 6px}#messages{flex:1;min-height:0;overflow-y:auto;padding:12px;overscroll-behavior:contain}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 12px;border-radius:12px;background:white;margin:0 20px 10px 0;line-height:1.45}.user{margin:0 0 10px 20px;background:#dcefe8}.message a{color:#12604e}#pending{max-height:140px;overflow:auto;padding:0 12px}.proposal{padding:8px;background:#fff;border:1px solid #bdd9cf;border-radius:10px;margin-bottom:8px;overflow-wrap:anywhere}.proposal button{margin-top:6px}footer{padding:10px 12px;background:white;border-top:1px solid #dde5e1}form{display:flex;gap:6px}input{min-width:0;flex:1;padding:10px;border:1px solid #a4b8af;border-radius:9px;font-size:16px}#status{min-height:20px;font-size:12px;color:#52665d;margin:6px 0}nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px}nav a{color:#146552}nav button{background:none;color:#52665d;padding:0;font-size:13px}
</style></head>
<body>
<header><h1>⚡ Консультант ekt.kz</h1><button id="close" aria-label="Закрыть чат">×</button></header>
<main id="messages" role="log" aria-live="polite" aria-label="Диалог"></main>
<section id="pending" aria-label="Подтверждение товаров"></section>
<footer><form id="form"><input id="text" maxlength="8000" required placeholder="Спросите о товаре…" aria-label="Ваше сообщение" autocomplete="off"><button id="send" type="submit" aria-label="Отправить сообщение">➤</button></form>
<p id="status" role="status"></p><nav><button id="manager" type="button">Позвать менеджера</button><a id="cart" target="_blank" rel="noopener" hidden>Открыть корзину</a><button id="reset" type="button">Новый чат</button></nav></footer>
<script>
const $ = id => document.getElementById(id);
const storageKey = 'ekt-session:' + (new URLSearchParams(location.search).get('site') || location.origin);
let sessionId = null, busy = false;
try { sessionId = sessionStorage.getItem(storageKey); } catch (_) {}
function remember() { try { sessionId ? sessionStorage.setItem(storageKey, sessionId) : sessionStorage.removeItem(storageKey); } catch (_) {} }
function message(role, text) {
  const div = document.createElement('div'); div.className = 'message ' + (role === 'user' ? 'user' : '');
  // Не исполняем HTML/Markdown из пользовательского ввода или ответа модели.
  for (const piece of text.split(/(https?:\/\/[^\s<>\])]+)/g)) {
    if (/^https?:\/\//.test(piece)) { const a = document.createElement('a'); a.href = piece; a.textContent = piece; a.target = '_blank'; a.rel = 'noopener noreferrer'; div.append(a); }
    else div.append(document.createTextNode(piece));
  }
  $('messages').append(div); $('messages').scrollTop = $('messages').scrollHeight;
}
function setBusy(value) { busy = value; $('send').disabled = value; $('reset').disabled = value; $('manager').disabled = value; document.querySelectorAll('#pending button').forEach(b => b.disabled = value); }
function render(data) {
  sessionId = data.session_id; remember(); $('messages').replaceChildren();
  data.history.forEach(m => message(m.role, m.content));
  $('pending').replaceChildren();
  for (const p of data.pending) {
    const row = document.createElement('div'); row.className = 'proposal';
    const label = document.createElement('div'); label.textContent = `${p.name} × ${p.qty}. Добавить в корзину?`;
    const button = document.createElement('button'); button.type = 'button'; button.textContent = 'Да, добавить';
    button.addEventListener('click', () => send('Да, добавь', p.proposal_id)); row.append(label,button); $('pending').append(row);
  }
  $('cart').href = data.cart_url; $('cart').hidden = false;
}
async function send(text, proposalId = null) {
  if (busy || !text.trim()) return;
  setBusy(true); message('user', text); $('status').textContent = 'Ищу ответ…';
  try {
    const response = await fetch('/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text, session_id:sessionId, proposal_id:proposalId})});
    const data = await response.json();
    if (!response.ok) { if(response.status === 404) {sessionId = null; remember(); $('pending').replaceChildren(); $('cart').hidden = true;} throw new Error(typeof data.detail === 'string' ? data.detail : 'Проверьте сообщение и повторите отправку.'); }
    render(data); $('text').value = ''; $('status').textContent = '';
  } catch (error) { $('status').textContent = error instanceof TypeError ? 'Нет связи с сервером. Попробуйте ещё раз.' : error.message; }
  finally { setBusy(false); }
}
$('manager').addEventListener('click', () => send('Позвать менеджера'));
$('form').addEventListener('submit', e => {e.preventDefault(); send($('text').value);});
$('close').addEventListener('click', () => parent.postMessage({type:'ekt-close'}, '*'));
document.addEventListener('keydown', e => {if(e.key === 'Escape') parent.postMessage({type:'ekt-close'}, '*');});
$('reset').addEventListener('click', () => {sessionId = null; remember(); $('messages').replaceChildren(); $('pending').replaceChildren(); $('cart').hidden = true; $('status').textContent = ''; message('assistant','Здравствуйте! Спросите о товаре, наличии или доставке.');});
(async () => {
  setBusy(true);
  if(sessionId) {
    try { const r = await fetch('/session/' + sessionId); if(r.ok) render(await r.json()); else if(r.status === 404) {sessionId=null; remember();} else throw new Error(); }
    catch (_) { $('status').textContent='Не удалось восстановить чат. Проверьте соединение.'; }
  }
  if(!$('messages').children.length) message('assistant','Здравствуйте! Спросите о товаре, наличии или доставке.');
  setBusy(false);
})();
</script></body></html>
